# Layouts
bind = Super+Shift, 1, setlayout, scroller
bind = Super+Shift, 2, setlayout, tile
bind = Super+Shift, 3, setlayout, dwindle
bind = Super+Shift, 4, setlayout, vertical_scroller

# Active window management
bind = Super, Q, killclient
bind = Super+Shift, Space, togglefloating
bind = Super, F, togglefullscreen
bind = Super, M, togglemaximizescreen

# Navigation
bind = Super, Left, focusdir, left
bind = Super, Right, focusdir, right
bind = Super, Up, focusdir, up
bind = Super, Down, focusdir, down

#Moving windows
bind = Super+Ctrl, Left, exchange_client, left
bind = Super+Ctrl, Right, exchange_client, right
bind = Super+Ctrl, Up, exchange_client, up
bind = Super+Ctrl, Down, exchange_client, down

#Resize windows
bind = Super+Shift, Left, setmfact, -0.05
bind = Super+Shift, Right, setmfact, +0.05
bind = Super+Shift, Up, setmfact, -0.05
bind = Super+Shift, Down, setmfact, +0.05
