# Changing workspaces
bind = Super, 1, view, 1
bind = Super, 2, view, 2
bind = Super, 3, view, 3
bind = Super, 4, view, 4
bind = Super, 5, view, 5
bind = Super, 6, view, 6
bind = Super, 7, view, 7
bind = Super, 8, view, 8
bind = Super, 9, view, 9

# Moving windows through workspaces
bind = Super+Ctrl, 1, tag, 1
bind = Super+Ctrl, 2, tag, 2
bind = Super+Ctrl, 3, tag, 3
bind = Super+Ctrl, 4, tag, 4
bind = Super+Ctrl, 5, tag, 5
bind = Super+Ctrl, 6, tag, 6
bind = Super+Ctrl, 7, tag, 7
bind = Super+Ctrl, 8, tag, 8
bind = Super+Ctrl, 9, tag, 9

#Tag 0 workspace
bind=SUPER,a,toggle_special_tag
bind=SUPER+SHIFT,a,tag_special_tag
bind=SUPER+CTRL,a,tag_special_silent
